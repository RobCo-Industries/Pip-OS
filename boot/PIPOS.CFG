# Pip-OS settings. Every key is optional. See docs/CONFIG.md.

[display]
# green, amber, blue or white
scheme = green
# Pause between boot lines, 0 to 2000 ms
line_delay_ms = 150

[audio]
# 0 to 100
volume = 80
# The level of each kind of sound, 0 to 100. 100 changes nothing.
# radio = 100
# sfx = 100
# recordings = 100
# games = 100
# Beep at power-on
beep = yes
