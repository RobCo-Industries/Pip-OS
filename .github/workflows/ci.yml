name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  ci:
    # The commit and the image tag must match the external/robco-core
    # submodule and its ci/IMAGE_TAG. `make check-pins` checks both.
    uses: RobCo-Industries/RobCo-Core/.github/workflows/robco-ci.yml@ecc956ff88d02f4c3aaab4e43db3072a2526dc79
    with:
      image-tag: ba6372158e4b
      make-targets: all test-host
      test-targets: test-target
      boards: '["raspi0","raspi1ap","raspi2b","raspi3b"]'
      artifact-path: build/pipos.img
